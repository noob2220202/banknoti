name: 🔑 라이선스 키 생성

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "유효 기간"
        required: true
        type: choice
        options:
          - "1일"
          - "7일"
          - "30일"
          - "9999일"
          - "직접 입력"
      custom_days:
        description: "직접 입력 시 일수 (예: 14)"
        required: false
        default: ""
      quantity:
        description: "생성 개수"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
        default: "1"
      memo:
        description: "메모 (누구에게 발급하는지 등)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 라이선스 키 생성
        run: |
          python3 - <<'PYEOF'
          import hmac, hashlib, time

          SECRET = "NB-NotifyBridge-2024-K9xP2mQr"

          duration_map = {"1일": 1, "7일": 7, "30일": 30, "9999일": 9999}

          duration_input = "${{ github.event.inputs.duration }}"
          custom_days    = "${{ github.event.inputs.custom_days }}"
          quantity       = int("${{ github.event.inputs.quantity }}")
          memo           = "${{ github.event.inputs.memo }}"

          if duration_input == "직접 입력" and custom_days.strip():
              days = int(custom_days.strip())
          else:
              days = duration_map.get(duration_input, 1)

          def generate(days, offset=0):
              expiry = int(time.time()) + days * 86400 + offset
              data = str(expiry)
              sig = hmac.new(SECRET.encode(), data.encode(), hashlib.sha256).hexdigest()[:12].upper()
              return f"{data}-{sig}", expiry

          import os
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")

          with open(summary, "a") as f:
              f.write(f"## 🔑 라이선스 키 발급 완료\n\n")
              f.write(f"| 항목 | 내용 |\n")
              f.write(f"|------|------|\n")
              f.write(f"| 유효 기간 | **{days}일** |\n")
              if memo:
                  f.write(f"| 메모 | {memo} |\n")
              f.write(f"| 발급 수량 | {quantity}개 |\n\n")
              f.write(f"### 발급된 키\n\n")
              f.write(f"```\n")
              for i in range(quantity):
                  key, expiry = generate(days, i)
                  from datetime import datetime
                  exp_str = datetime.utcfromtimestamp(expiry).strftime("%Y-%m-%d")
                  f.write(f"{key}   (만료: {exp_str})\n")
              f.write(f"```\n")

          PYEOF
