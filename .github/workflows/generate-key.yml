name: 🔑 라이선스 키 생성

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "유효 기간"
        required: true
        type: choice
        options: ["1일", "7일", "30일", "9999일", "직접 입력"]
      custom_days:
        description: "직접 입력 시 일수 (예: 14)"
        required: false
        default: ""
      quantity:
        description: "생성 개수"
        required: true
        type: choice
        options: ["1", "3", "5", "10"]
        default: "1"
      memo:
        description: "메모 (수신자 등)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: VPS 서버에서 키 생성
        run: |
          DURATION="${{ github.event.inputs.duration }}"
          CUSTOM="${{ github.event.inputs.custom_days }}"
          QUANTITY="${{ github.event.inputs.quantity }}"
          MEMO="${{ github.event.inputs.memo }}"

          case "$DURATION" in
            "1일")    DAYS=1    ;;
            "7일")    DAYS=7    ;;
            "30일")   DAYS=30   ;;
            "9999일") DAYS=9999 ;;
            *)        DAYS=${CUSTOM:-1} ;;
          esac

          curl -s -X POST "${{ secrets.LICENSE_SERVER_URL }}/api/generate" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${{ secrets.LICENSE_ADMIN_TOKEN }}" \
            -d "{\"days\": $DAYS, \"quantity\": $QUANTITY, \"memo\": \"$MEMO\"}" \
            -o response.json

          echo "=== 서버 응답 ===" && cat response.json

          # Python 스크립트를 파일로 저장 (heredoc 충돌 방지)
          cat > parse_keys.py << 'PYEOF'
          import json, os, sys
          from datetime import datetime, timedelta

          with open("response.json") as f:
              raw = f.read().strip()

          if not raw or raw.startswith("<"):
              print("서버 오류: HTML 응답 받음", file=sys.stderr)
              sys.exit(1)

          data = json.loads(raw)
          keys = data.get("keys", [])
          days = data.get("days", 0)
          memo = data.get("memo", "")

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          exp = (datetime.utcnow() + timedelta(days=days)).strftime("%Y-%m-%d")

          lines = []
          lines.append("## 🔑 라이선스 키 발급 완료\n")
          lines.append("| 항목 | 내용 |")
          lines.append("|------|------|")
          lines.append(f"| 유효 기간 | **{days}일** |")
          if memo:
              lines.append(f"| 메모 | {memo} |")
          lines.append(f"| 발급 수량 | {len(keys)}개 |\n")
          lines.append("### 발급된 키 (1회용)\n")
          lines.append("```")
          for key in keys:
              lines.append(f"{key}   (만료: {exp})")
          lines.append("```")

          with open(summary_file, "a") as f:
              f.write("\n".join(lines) + "\n")

          print(f"키 {len(keys)}개 발급 완료")
          PYEOF

          python3 parse_keys.py
