name: 🔑 라이선스 키 생성

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "유효 기간"
        required: true
        type: choice
        options: ["1일", "7일", "30일", "9999일", "직접 입력"]
      custom_days:
        description: "직접 입력 시 일수 (예: 14)"
        required: false
        default: ""
      quantity:
        description: "생성 개수"
        required: true
        type: choice
        options: ["1", "3", "5", "10"]
        default: "1"
      memo:
        description: "메모 (수신자 등)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: VPS 서버에서 키 생성
        run: |
          DURATION="${{ github.event.inputs.duration }}"
          CUSTOM="${{ github.event.inputs.custom_days }}"
          QUANTITY="${{ github.event.inputs.quantity }}"
          MEMO="${{ github.event.inputs.memo }}"

          case "$DURATION" in
            "1일")    DAYS=1    ;;
            "7일")    DAYS=7    ;;
            "30일")   DAYS=30   ;;
            "9999일") DAYS=9999 ;;
            *)        DAYS=${CUSTOM:-1} ;;
          esac

          RESPONSE=$(curl -s -X POST "${{ secrets.LICENSE_SERVER_URL }}/api/generate" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${{ secrets.LICENSE_ADMIN_TOKEN }}" \
            -d "{\"days\": $DAYS, \"quantity\": $QUANTITY, \"memo\": \"$MEMO\"}")

          echo "서버 응답: $RESPONSE"

          python3 - <<PYEOF
          import json, os
          from datetime import datetime, timedelta

          data = json.loads('''$RESPONSE''')
          keys = data.get("keys", [])
          days = data.get("days", 0)
          memo = data.get("memo", "")

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(summary_file, "a") as f:
              f.write(f"## 🔑 라이선스 키 발급 완료\n\n")
              f.write(f"| 항목 | 내용 |\n|------|------|\n")
              f.write(f"| 유효 기간 | **{days}일** |\n")
              if memo:
                  f.write(f"| 메모 | {memo} |\n")
              f.write(f"| 발급 수량 | {len(keys)}개 |\n\n")
              f.write(f"### 발급된 키 (1회용)\n\n```\n")
              exp = (datetime.utcnow() + timedelta(days=days)).strftime("%Y-%m-%d")
              for key in keys:
                  f.write(f"{key}   (만료: {exp})\n")
              f.write(f"```\n")
          PYEOF
