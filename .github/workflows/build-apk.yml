name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk NotifyBridge.apk

      - name: Delete old release if exists
        run: gh release delete latest-build --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and upload APK
        run: |
          gh release create latest-build NotifyBridge.apk \
            --title "NotifyBridge 최신 빌드" \
            --notes "최신 커밋에서 자동 빌드된 APK입니다." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
